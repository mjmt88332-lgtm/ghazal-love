<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghazal Jomaa ❤️</title>
<style>
*{box-sizing:border-box}
:root{--pink:#d94b78;--deep:#9e3155;--soft:#fff0f5;--line:#e8b7c8}
html,body{margin:0;min-height:100%;font-family:"Tahoma","Arial",sans-serif}
body{
  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.9) 0 3px,transparent 4px),
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.75) 0 2px,transparent 3px),
    linear-gradient(180deg,#ffe7f0,#fff7fa);
  color:#6d3a4d; overflow-x:hidden;
}
.app{width:min(100%,760px);margin:auto;min-height:100vh;padding:18px 14px 45px}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{
  width:100%;background:rgba(255,255,255,.94);border:1px solid #fff;
  border-radius:30px;padding:30px 24px;box-shadow:0 18px 55px rgba(157,55,91,.14);
  text-align:center
}
.logo{font-size:64px;line-height:1;margin-bottom:14px}
h1{margin:0;color:#74384e;font-size:38px}
h2{color:#a33458;font-size:29px;margin:0 0 25px}
p{line-height:1.9}
.muted{color:#9a7d89;font-size:18px}
input{
  width:100%;padding:17px 20px;border:2px solid var(--line);border-radius:18px;
  text-align:center;font-size:21px;outline:none;background:#fff;margin:15px 0
}
input:focus{border-color:var(--pink)}
.btn{
  border:0;border-radius:999px;background:var(--pink);color:#fff;
  padding:15px 30px;font-size:20px;font-weight:800;cursor:pointer;
  box-shadow:0 8px 20px rgba(190,48,91,.2);transition:.16s transform,.16s opacity
}
.btn:active{transform:scale(.97)}
.btn.secondary{background:#fff;color:var(--deep);border:2px solid var(--line);box-shadow:none}
.error{color:#c72e50;font-weight:700;min-height:26px}
.heartline{font-size:28px;letter-spacing:5px}
.introText{font-size:22px;font-weight:600}
.memoryTitle{font-size:38px;margin:5px 0;color:#74384e}
.memory{
  background:#fff;padding:12px;border-radius:28px;box-shadow:0 15px 40px rgba(90,30,50,.12)
}
.memory img{
  width:100%;height:610px;object-fit:cover;border-radius:20px;display:block;
  background:#eee;cursor:pointer
}
.caption{font-size:19px;margin:16px 6px 4px}
.nav{display:flex;gap:12px;justify-content:center;margin-top:18px}
.nav .btn{flex:1}
.progress{height:8px;background:#f4dce5;border-radius:20px;overflow:hidden;margin:0 0 22px}
.progress>div{height:100%;background:var(--pink);transition:.25s;width:0}
.option{
  display:block;width:100%;margin:12px 0;padding:16px 18px;border-radius:18px;
  border:2px solid var(--line);background:#fff;color:#873b56;font-size:20px;
  font-weight:800;cursor:pointer
}
.option.selected{background:var(--pink);color:#fff;border-color:var(--pink)}
.option.correct{background:#42a36a;color:#fff;border-color:#42a36a}
.option.wrong{background:#d84b5d;color:#fff;border-color:#d84b5d}
.finalHeart{font-size:82px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.small{font-size:15px;color:#a98c96}
@media(max-width:600px){
 .app{padding:10px 10px 30px}
 .card{padding:26px 18px}
 h1{font-size:31px}.memoryTitle{font-size:30px}
 .memory img{height:570px}
 .introText{font-size:20px}.option{font-size:18px}
 .nav .btn{padding:14px 10px;font-size:17px}
}
</style>
</head>
<body>
<div class="app"><main id="root"></main></div>

<script>
const photos = [
 {src:"assets/photo1.jpg", caption:"أحلى الذكريات ❤️"},
 {src:"assets/photo2.jpg", caption:"تفاصيل صغيرة بس بتعنيلي كتير 🥹"},
 {src:"assets/photo3.jpg", caption:"لحظة من اللحظات اللي ما بتننسى ❤️"},
 {src:"assets/photo4.jpg", caption:"والمشوار الحلو لسه بأوله 😚"}
];

const questions = [
 {q:"ايمت أول مرة جبتلك وردة؟ 🌹", options:["2025 😌","2024 🫂"], correct:0},
 {q:"ايمت عيد ميلادي؟ 🎂", options:["21/7/2003 🤔","21/9/2003 😂"], correct:0},
 {q:"بتحبيني؟ 🥹", options:["اي 🥹","لا 😡"], correct:0},
 {q:"مرتاحه معي؟ ❤️", options:["اي 😚","لا 🥺💔"], correct:0},
 {q:"تتوقعي ح كون الزوج المثالي؟ 😌", options:["اي 😌","برضو اي 🙂"], correct:0},
 {q:"بحبك؟ ❤️‍🔥", options:["اي 😉","عدد كل شي بالدنيا ❤️‍🔥😚😂"], correct:1}
];

let screen="password", memory=0, q=0, score=0, answers={};

function render(){
 const root=document.getElementById("root");
 let out="";
 if(screen==="password"){
   out=`<section class="page fade"><div class="card">
     <div class="logo">🔐❤️</div>
     <h1>عندي إلك شغلة صغيرة...</h1>
     <p class="muted">اكتبي كلمة السر لتفتحيها 🫣</p>
     <input id="pw" type="password" placeholder="كلمة السر" autocomplete="off"
       onkeydown="if(event.key==='Enter')checkPassword()">
     <div class="error" id="err"></div>
     <button class="btn" onclick="checkPassword()">دخول ❤️</button>
   </div></section>`;
 } else if(screen==="intro"){
   out=`<section class="page fade"><div class="card">
      <div class="heartline">❤️ ❤️ ❤️</div>
      <h1 style="margin:15px 0">24/9/2023</h1>
      <p class="introText">من هون بلشت حكاية إلها مكان خاص بقلبي...<br>جاهزة نرجع نتذكر شوي؟ 🥹❤️</p>
      <button class="btn" onclick="screen='memory';render()">Next ❤️</button>
   </div></section>`;
 } else if(screen==="memory"){
   const p=photos[memory];
   out=`<section class="fade" style="padding-top:24px">
      <h1 class="memoryTitle">Our Lovely Memories ❤️</h1>
      <p class="muted">دوسي على الصورة مرتين ✨</p>
      <div class="memory">
       <img src="${p.src}" ondblclick="heartBurst()" alt="memory">
       <p class="caption">${p.caption}</p>
      </div>
      <div class="nav">
       <button class="btn secondary" onclick="prevMemory()">Previous</button>
       <button class="btn" onclick="nextMemory()">Next ❤️</button>
      </div>
      <p class="small">${memory+1} / ${photos.length}</p>
   </section>`;
 } else if(screen==="quiz"){
   const item=questions[q], selected=answers[q];
   out=`<section class="page fade"><div style="width:100%">
      <div class="progress"><div style="width:${((q+1)/questions.length)*100}%"></div></div>
      <div class="card">
       <p class="muted">السؤال ${q+1} من ${questions.length}</p>
       <h2>${item.q}</h2>
       ${item.options.map((x,i)=>{
         let cls="";
         if(selected!==undefined) cls=i===item.correct?"correct":(i===selected?"wrong":"");
         if(selected===i && i===item.correct) cls="correct";
         return `<button class="option ${cls}" onclick="answer(${i})">${x}</button>`;
       }).join("")}
       <div class="nav">
        <button class="btn secondary" onclick="prevQuestion()">Previous</button>
        <button class="btn" onclick="nextQuestion()">Next ❤️</button>
       </div>
      </div>
   </div></section>`;
 } else {
   out=`<section class="page fade"><div class="card">
      <div class="finalHeart">❤️</div>
      <h1>خلصنا 🥹❤️</h1>
      <p style="font-size:24px;font-weight:800">نتيجتك ${score} / ${questions.length}</p>
      <p style="font-size:21px">وبغض النظر عن النتيجة...<br>إنتِ بتعرفي إنك أغلى شي عندي ❤️‍🔥</p>
      <button class="btn" onclick="restart()">نعيدها؟ 😚</button>
   </div></section>`;
 }
 root.innerHTML=out;
}
function checkPassword(){
 const v=document.getElementById("pw").value;
 if(v==="Ghazal jomaa"){screen="intro";render();}
 else document.getElementById("err").textContent="كلمة السر مو هي 😭❤️ جرّبي كمان مرة";
}
function nextMemory(){if(memory<photos.length-1){memory++;render()}else{screen="quiz";render()}}
function prevMemory(){if(memory>0){memory--;render()}}
function answer(i){
 const old=answers[q];
 if(old===undefined){if(i===questions[q].correct)score++}
 else if(old===questions[q].correct && i!==old)score--;
 else if(old!==questions[q].correct && i===questions[q].correct)score++;
 answers[q]=i;render();
}
function nextQuestion(){if(q<questions.length-1){q++;render()}else{screen="result";render()}}
function prevQuestion(){if(q>0){q--;render()}else{screen="memory";render()}}
function restart(){screen="password";memory=0;q=0;score=0;answers={};render()}
function heartBurst(){
 for(let i=0;i<12;i++){
   const h=document.createElement("div");h.textContent=["❤️","💗","💕","✨"][i%4];
   h.style.cssText=`position:fixed;left:${45+Math.random()*10}%;top:48%;font-size:${18+Math.random()*24}px;z-index:99;pointer-events:none;transition:1.1s ease`;
   document.body.appendChild(h);
   requestAnimationFrame(()=>{h.style.transform=`translate(${(Math.random()-.5)*300}px,${-120-Math.random()*300}px) rotate(${(Math.random()-.5)*90}deg)`;h.style.opacity=0});
   setTimeout(()=>h.remove(),1100);
 }
}
render();
</script>
</body>
</html>
